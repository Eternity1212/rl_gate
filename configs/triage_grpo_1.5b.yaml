# TRIAGE-GRPO main config (locked defaults — see docs/EXPERIMENT_PLAN.md)

experiment:
  name: triage_grpo_qwen25_math_1.5b
  seed: 0

model:
  path: Qwen/Qwen2.5-Math-1.5B
  # Optional Phase C:
  # path: Qwen/Qwen2.5-Math-7B

data:
  train: DAPO-Math-17k
  # Local path filled in Phase B, e.g.:
  # train_file: data/DAPO-Math-17k/train.parquet
  max_prompt_length: 1024
  max_response_length: 2048

algorithm:
  name: grpo
  group_size: 8

triage:
  method: triage
  tau: 0.5
  alpha: 1.0
  beta: 1.0
  gamma: 0.1
  w_high_mode: filter   # filter | downweight
  lens_normalize: true
  process_scorer: rule  # rule | prm  (switch to prm after scorer is pinned)
  # prm_model: REPLACE_WITH_FIXED_PRM

lora:
  enabled: true
  r: 64
  alpha: 128
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

trainer:
  framework: verl
  n_gpus: 2
  total_epochs: 1          # raise for full runs in Phase C
  save_freq: 50
  logging:
    - console
    # - wandb

eval:
  benchmarks:
    - MATH-500
    - AMC23
    - AIME24
    - AIME25
    - OlympiadBench
    - MinervaMath
