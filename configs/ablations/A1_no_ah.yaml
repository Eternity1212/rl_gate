# Ablation: disable W_HIGH special treatment (treat like ordinary wrong via gamma=0 on W_HIGH path)
experiment:
  name: A1_no_ah
  seed: 0
model:
  path: Qwen/Qwen2.5-Math-1.5B
data:
  train: DAPO-Math-17k
  max_response_length: 2048
algorithm:
  name: grpo
  group_size: 8
triage:
  method: triage
  tau: 0.5
  alpha: 1.0
  beta: 0.0
  gamma: 0.1
  w_high_mode: downweight
  process_scorer: rule
lora:
  enabled: true
  r: 64
  alpha: 128
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

trainer:
  framework: verl
  n_gpus: 2
