# Ablation: gamma=0 (no W_LOW confidence penalty)
experiment:
  name: A4_no_lens
  seed: 0
model:
  path: Qwen/Qwen2.5-Math-1.5B
data:
  train: DAPO-Math-17k
algorithm:
  name: grpo
  group_size: 8
triage:
  method: triage
  alpha: 1.0
  gamma: 0.0
  w_high_mode: filter
  process_scorer: rule
lora:
  enabled: true
  r: 64
  alpha: 128
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

trainer:
  framework: verl
  n_gpus: 2
