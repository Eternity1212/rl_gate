# B1: ORM-GRPO
experiment:
  name: baseline_orm_grpo_1.5b
  seed: 0
model:
  path: Qwen/Qwen2.5-Math-1.5B
data:
  train: DAPO-Math-17k
  max_response_length: 2048
algorithm:
  name: grpo
  group_size: 8
triage:
  method: orm_grpo
  process_scorer: rule
lora:
  enabled: true
  r: 64
  alpha: 128
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

trainer:
  framework: verl
  n_gpus: 2
